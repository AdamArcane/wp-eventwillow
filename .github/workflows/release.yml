name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: eventwillow-sync-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build release
        env:
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL || 'https://files.arcanetechct.com/eventwillow-sync' }}
        run: python3 tools/build-release.py --version "${GITHUB_REF_NAME#v}" --base-url "$RELEASE_BASE_URL"
      - name: Publish ZIP, then manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'plugins' }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          version="${GITHUB_REF_NAME#v}"
          key="s3://${R2_BUCKET}/eventwillow-sync/eventwillow-sync-${version}.zip"
          if aws s3 ls "$key" --endpoint-url "$endpoint" | grep -q .; then
            echo "Release archive already exists; use a new version."
            exit 1
          fi
          aws s3 cp "dist/eventwillow-sync-${version}.zip" "$key" --endpoint-url "$endpoint" --content-type application/zip --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/info.json "s3://${R2_BUCKET}/eventwillow-sync/info.json" --endpoint-url "$endpoint" --content-type application/json --cache-control 'public,max-age=300'
      - uses: actions/upload-artifact@v4
        with:
          name: eventwillow-sync-release
          path: dist/
