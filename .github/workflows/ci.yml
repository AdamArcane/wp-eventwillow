name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Release script syntax
        run: python3 -m py_compile tools/build-release.py
      - name: Build installation package
        run: python3 tools/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: eventwillow-sync-validation
          path: dist/
