name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - name: Release script syntax
        run: |
          python3 -m py_compile scripts/release.py
          bash -n scripts/prepare-release.sh
      - name: Build installation package
        run: python3 scripts/release.py build
      - uses: actions/upload-artifact@v4
        with:
          name: eventwillow-public-validation
          path: build/
